spring:
  application:
    name: friend-feed
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/feed?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:feed}
    password: ${MYSQL_PASSWORD:feed}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 10000
        request.timeout.ms: 10000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:friend-feed-fanout-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:25MB}

feed:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  page:
    default-size: 20
    max-size: 100
    scan-factor: 3
    max-scan-rounds: 10
  fanout:
    topic: ${FANOUT_TOPIC:feed.post-published.v1}
    dispatch-delay-ms: 300
    recovery-delay-ms: 10000
    batch-size: 50
    max-attempts: 8
    initial-backoff: 1s
    max-backoff: 15m
    processing-timeout: 2m
    send-timeout: 10s
    auto-policy:
      enabled: ${FANOUT_AUTO_ENABLED:true}
      pull-threshold: ${FANOUT_AUTO_PULL_THRESHOLD:10000}
      push-threshold: ${FANOUT_AUTO_PUSH_THRESHOLD:8000}
      batch-size: ${FANOUT_AUTO_BATCH_SIZE:500}
      max-batches: ${FANOUT_AUTO_MAX_BATCHES:20}
      initial-delay-ms: ${FANOUT_AUTO_INITIAL_DELAY_MS:15000}
      delay-ms: ${FANOUT_AUTO_DELAY_MS:60000}
  cache:
    post-ttl: 10m
    author-timeline-ttl: ${AUTHOR_TIMELINE_CACHE_TTL:5m}
    author-timeline-max-entries: ${AUTHOR_TIMELINE_CACHE_MAX_ENTRIES:500}
  shadow:
    enabled: ${FEED_SHADOW_ENABLED:true}
    sample-rate: ${FEED_SHADOW_SAMPLE_RATE:0.1}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
    max-attachments-per-post: 9
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://friend-feed.local}
      secret: ${JWT_SECRET:local-development-secret-change-before-production}
      ttl: ${JWT_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:30d}
    session-retention: ${AUTH_SESSION_RETENTION:7d}
    session-cleanup-initial-delay-ms: 300000
    session-cleanup-delay-ms: 86400000
    login-rate-limit:
      account-max-attempts: ${LOGIN_ACCOUNT_MAX_ATTEMPTS:5}
      address-max-attempts: ${LOGIN_ADDRESS_MAX_ATTEMPTS:20}
      window: ${LOGIN_RATE_WINDOW:15m}
      block-duration: ${LOGIN_BLOCK_DURATION:15m}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
