spring:
  application:
    name: friend-feed
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/feed?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:feed}
    password: ${MYSQL_PASSWORD:feed}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 10000
        request.timeout.ms: 10000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:friend-feed-fanout-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:25MB}

feed:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  page:
    default-size: 20
    max-size: 100
    scan-factor: 3
    max-scan-rounds: 10
  fanout:
    topic: ${FANOUT_TOPIC:feed.post-published.v1}
    dispatch-delay-ms: 300
    recovery-delay-ms: 10000
    batch-size: 50
    max-attempts: 8
    initial-backoff: 1s
    max-backoff: 15m
    processing-timeout: 2m
    send-timeout: 10s
  cache:
    post-ttl: 10m
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
    max-attachments-per-post: 9
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://friend-feed.local}
      secret: ${JWT_SECRET:local-development-secret-change-before-production}
      ttl: ${JWT_TTL:2h}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
