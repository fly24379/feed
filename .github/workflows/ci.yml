name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend-build:
    name: Frontend locked build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  flyway-validation:
    name: Flyway migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: feed
          MYSQL_USER: feed
          MYSQL_PASSWORD: feed
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply all migrations to an empty database
        run: >-
          docker run --rm --network host
          --volume "${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:11-alpine
          "-url=jdbc:mysql://127.0.0.1:3306/feed?allowPublicKeyRetrieval=true&useSSL=false"
          -user=feed
          -password=feed
          -connectRetries=30
          migrate

      - name: Validate migration history and checksums
        run: >-
          docker run --rm --network host
          --volume "${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:11-alpine
          "-url=jdbc:mysql://127.0.0.1:3306/feed?allowPublicKeyRetrieval=true&useSSL=false"
          -user=feed
          -password=feed
          validate

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: friend-feed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
